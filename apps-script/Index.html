<!DOCTYPE html>
<html lang="es-MX">
<head>
<base target="_top">
<meta charset="UTF-8">
<style>
  :root { --azul:#0b3d66; --azul-claro:#1a6fb0; --fondo:#f7f9fb; --texto:#1c2b36; --borde:#dbe3ea; --gris:#6b7c88; }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 5rem; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; margin: 0;
         background: var(--fondo); color: var(--texto); line-height: 1.45; }
  header { background: var(--azul); color: #fff; padding: 2rem 1rem 1.6rem; text-align: center; position: relative; }
  header h1 { margin: 0 0 .4rem; font-size: 1.9rem; }
  header p { margin: 0; opacity: .9; font-size: .95rem; }
  .sesion { position: absolute; top: .7rem; right: 1rem; font-size: .8rem; opacity: .85; }
  .sesion a { color: #fff; }
  .barra { position: sticky; top: 0; z-index: 5; background: var(--fondo); border-bottom: 1px solid var(--borde); padding: .8rem 1rem; }
  .barra input { display: block; width: 100%; max-width: 640px; margin: 0 auto; padding: .7rem 1rem; font-size: 1rem;
                 border: 1px solid var(--borde); border-radius: 999px; background: #fff; color: var(--texto); }
  main { max-width: 1200px; margin: 0 auto; padding: 1.2rem 1rem 2rem; }
  nav.toc { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 1.5rem; }
  .chip { background: #fff; border: 1px solid var(--borde); border-radius: 999px; padding: .35rem .8rem; font-size: .88rem;
          color: var(--azul-claro); text-decoration: none; cursor: pointer; }
  .chip:hover { border-color: var(--azul-claro); }
  .chip span, .count { color: var(--gris); font-size: .85em; font-weight: normal; }
  section { margin-bottom: 2.2rem; }
  section h2 { color: var(--azul); border-bottom: 2px solid #e3ecf3; padding-bottom: .4rem; font-size: 1.25rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 1.2rem 1rem; }
  .libro { color: var(--texto); text-decoration: none; display: block; min-width: 0; }
  .portada { aspect-ratio: 3/4; background: #fff; border: 1px solid var(--borde); border-radius: 6px; overflow: hidden;
             box-shadow: 0 1px 3px rgba(11,61,102,.08); transition: transform .15s, box-shadow .15s; position: relative; }
  .libro:hover .portada { transform: translateY(-3px); box-shadow: 0 6px 16px rgba(11,61,102,.18); }
  .portada img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
  .ph { display: none; }
  .portada.sin { display: flex; align-items: center; justify-content: center; padding: .8rem;
                 background: linear-gradient(160deg, var(--azul), var(--azul-claro)); }
  .portada.sin .ph { display: block; color: #fff; font-weight: 600; text-align: center; font-size: .9rem; }
  .libro p { margin: .5rem 0 0; font-size: .86rem; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .libro:hover p { color: var(--azul-claro); }
  .oculto { display: none !important; }
  #vacio { text-align: center; color: var(--gris); padding: 2rem 0; }
  footer { text-align: center; color: var(--gris); font-size: .85rem; padding: 2rem 1rem 3rem; }
  @media (max-width: 480px) { .grid { grid-template-columns: repeat(2, 1fr); } header h1 { font-size: 1.5rem; } .sesion { position: static; margin-bottom: .6rem; } }
</style>
</head>
<body>
<header>
  <div class="sesion"><?= correo ?> · <a href="https://accounts.google.com/Logout">Cerrar sesión</a></div>
  <h1>Biblioteca Virtual UDHI</h1>
  <p id="resumen">Universidad Dolores Hidalgo</p>
</header>
<div class="barra"><input id="q" type="search" placeholder="Buscar por título…" aria-label="Buscar por título"></div>
<main>
  <nav class="toc" id="toc"></nav>
  <div id="secciones"></div>
  <p id="vacio" class="oculto">Ningún documento coincide con la búsqueda.</p>
</main>
<footer>Biblioteca Virtual UDHI · material de consulta exclusivo para la comunidad UDHI</footer>
<script>
  var CAT = <?!= datos ?>;
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function norm(s) { return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
  function ancla(s) { return norm(s).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); }
  var total = 0, toc = [], html = [];
  CAT.forEach(function (c) {
    total += c.l.length;
    toc.push('<a class="chip" data-a="' + ancla(c.c) + '">' + esc(c.c) + ' <span>' + c.l.length + '</span></a>');
    html.push('<section id="' + ancla(c.c) + '"><h2>' + esc(c.c) + ' <span class="count">' + c.l.length + '</span></h2><div class="grid">' +
      c.l.map(function (x) {
        var t = esc(x[1]);
        var img = x[2] ? '<img src="' + esc(x[2]) + '" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.classList.add(\'sin\');this.remove()">' : '';
        return '<a class="libro" target="_blank" rel="noopener" href="https://drive.google.com/file/d/' + esc(x[0]) + '/view"' +
          ' data-id="' + esc(x[0]) + '" data-c="' + esc(c.c) + '" data-t="' + t + '" data-n="' + esc(norm(x[1])) + '">' +
          '<div class="portada' + (x[2] ? '' : ' sin') + '">' + img + '<span class="ph">' + t + '</span></div><p>' + t + '</p></a>';
      }).join('') + '</div></section>');
  });
  document.getElementById('resumen').textContent = 'Universidad Dolores Hidalgo — ' + total + ' documentos en ' + CAT.length + ' categorías';
  document.getElementById('toc').innerHTML = toc.join('');
  document.getElementById('secciones').innerHTML = html.join('');

  document.getElementById('toc').addEventListener('click', function (e) {
    var a = e.target.closest('.chip'); if (a) document.getElementById(a.dataset.a).scrollIntoView();
  });
  document.getElementById('secciones').addEventListener('click', function (e) {
    var l = e.target.closest('.libro');
    if (l) google.script.run.abrir(l.dataset.id, l.dataset.t, l.dataset.c);
  });
  var q = document.getElementById('q'), libros = document.querySelectorAll('.libro'), secciones = document.querySelectorAll('main section');
  q.addEventListener('input', function () {
    var t = norm(q.value.trim()), hay = 0;
    libros.forEach(function (l) { l.classList.toggle('oculto', !!t && l.dataset.n.indexOf(t) < 0); });
    secciones.forEach(function (s) { var n = s.querySelectorAll('.libro:not(.oculto)').length; hay += n; s.classList.toggle('oculto', n === 0); });
    document.getElementById('toc').classList.toggle('oculto', !!t);
    document.getElementById('vacio').classList.toggle('oculto', hay > 0);
  });
</script>
</body>
</html>
