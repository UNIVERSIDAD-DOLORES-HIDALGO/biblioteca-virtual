<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biblioteca Virtual UDHI</title>
<meta name="description" content="Biblioteca Virtual de la Universidad Dolores Hidalgo. Acceso con correo institucional @udhi.edu.mx.">
<meta name="robots" content="noindex">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self' data:; form-action https://accounts.google.com">
<style>
  :root { --azul:#0b3d66; --azul-claro:#1a6fb0; --fondo:#f7f9fb; --texto:#1c2b36; --borde:#dbe3ea; --gris:#6b7c88; --error:#b3261e; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; color: var(--texto);
         background: linear-gradient(160deg, var(--azul) 0%, var(--azul-claro) 100%); }
  .tarjeta { background: #fff; width: 100%; max-width: 400px; border-radius: 12px; padding: 2.2rem 1.8rem 1.8rem;
             box-shadow: 0 12px 40px rgba(0,0,0,.25); }
  .marca { text-align: center; margin-bottom: 1.6rem; }
  .marca .sello { width: 56px; height: 56px; border-radius: 50%; background: var(--azul); color: #fff; font-weight: 700;
                  display: inline-flex; align-items: center; justify-content: center; font-size: 1.05rem; letter-spacing: .5px; }
  h1 { font-size: 1.45rem; margin: .8rem 0 .2rem; color: var(--azul); }
  .marca p { margin: 0; color: var(--gris); font-size: .92rem; }
  label { display: block; font-size: .88rem; font-weight: 600; margin: 0 0 .35rem; }
  input { width: 100%; padding: .75rem .9rem; font-size: 1rem; border: 1px solid var(--borde); border-radius: 8px; color: var(--texto); }
  input:focus { outline: 2px solid var(--azul-claro); outline-offset: -1px; border-color: transparent; }
  input[aria-invalid="true"] { border-color: var(--error); }
  #error { color: var(--error); font-size: .85rem; min-height: 1.2rem; margin: .4rem 0 .6rem; }
  button { width: 100%; padding: .8rem; font-size: 1rem; font-weight: 600; border: 0; border-radius: 8px;
           background: var(--azul); color: #fff; cursor: pointer; }
  button:hover { background: var(--azul-claro); }
  .nota { font-size: .82rem; color: var(--gris); margin: 1.2rem 0 0; line-height: 1.45; }
  .pasos { display: flex; gap: .5rem; font-size: .8rem; color: var(--gris); margin-bottom: 1.2rem; }
  .pasos span { flex: 1; text-align: center; padding: .35rem; border-radius: 6px; background: var(--fondo); }
  .pasos .activo { background: #e3ecf3; color: var(--azul); font-weight: 600; }
</style>
</head>
<body>
<main class="tarjeta">
  <div class="marca">
    <div class="sello">UDHI</div>
    <h1>Biblioteca Virtual</h1>
    <p>Universidad Dolores Hidalgo</p>
  </div>
  <div class="pasos"><span class="activo">1 · Correo</span><span>2 · Contraseña</span></div>
  <form id="f" novalidate>
    <label for="correo">Correo institucional</label>
    <input id="correo" type="email" autocomplete="username" inputmode="email" placeholder="tu.nombre@udhi.edu.mx" required autofocus>
    <div id="error" role="alert"></div>
    <button type="submit">Continuar</button>
  </form>
  <p class="nota">Tu contraseña es la misma de tu correo institucional y la pide Google en el siguiente paso;
    la Biblioteca nunca la ve ni la guarda. Solo cuentas <strong>@udhi.edu.mx</strong>.</p>
</main>
<script>
  // Web app de Apps Script: solo acepta sesiones de udhi.edu.mx (Google valida la contraseña).
  var BIBLIOTECA = 'https://script.google.com/a/macros/udhi.edu.mx/s/AKfycbynif50v-fITIqmKr_2TFRyaOJhsI2BIDnOts0th1LfIMTtN9E9GPX7cU1NBz-D7DTK/exec';
  var f = document.getElementById('f'), c = document.getElementById('correo'), err = document.getElementById('error');
  f.addEventListener('submit', function (e) {
    e.preventDefault();
    var v = c.value.trim().toLowerCase();
    if (v && v.indexOf('@') < 0) v += '@udhi.edu.mx';
    if (!/^[^\s@]+@udhi\.edu\.mx$/.test(v)) {
      c.setAttribute('aria-invalid', 'true');
      err.textContent = 'Usa tu correo institucional, el que termina en @udhi.edu.mx.';
      return;
    }
    c.value = v; c.removeAttribute('aria-invalid'); err.textContent = '';
    location.href = 'https://accounts.google.com/AccountChooser?Email=' + encodeURIComponent(v) +
      '&continue=' + encodeURIComponent(BIBLIOTECA);
  });
</script>
</body>
</html>
